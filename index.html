<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#12161d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ioio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world"></canvas>

  <header id="topbar">
    <div id="stock"></div>
    <div id="goalbar" title="Current goal"><div id="goalfill"></div></div>
  </header>

  <div id="toasts"></div>

  <section id="sheet"><div id="sheet-body"></div></section>

  <nav id="bottombar">
    <button data-open="build"><span class="i">🔨</span><span>Build</span></button>
    <button data-open="goals"><span class="i">🎯</span><span>Goals</span></button>
    <button data-open="menu"><span class="i">⚙️</span><span>Menu</span></button>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/geom.js"></script>
  <script src="js/model.js"></script>
  <script src="js/render.js"></script>
  <script src="js/input.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
